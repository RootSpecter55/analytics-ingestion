# Reference deployment to Amazon ECS. Manual trigger only: it never runs on push.
#
# The API and the flusher are two ECS services running the same image with different commands.
# The API scales freely; the flusher service runs exactly one task (it has a fixed consumer name).
#
# Requires these repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION, AWS_ACCOUNT_ID, AWS_DEPLOY_ROLE_ARN (role trusted for GitHub OIDC),
#   ECR_REPOSITORY, ECS_CLUSTER, ECS_API_SERVICE, ECS_FLUSHER_SERVICE,
#   EXECUTION_ROLE_ARN, TASK_ROLE_ARN (allowed to use the bucket and Athena), SECRET_ID,
#   S3_BUCKET, ATHENA_DATABASE, ATHENA_WORKGROUP, ATHENA_OUTPUT_LOCATION
# No long-lived AWS keys are stored: credentials come from assuming the role via OIDC.
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write # needed to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Fill in task definition placeholders
        env:
          EXECUTION_ROLE_ARN: ${{ vars.EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
          SECRET_ID: ${{ vars.SECRET_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          ATHENA_DATABASE: ${{ vars.ATHENA_DATABASE }}
          ATHENA_WORKGROUP: ${{ vars.ATHENA_WORKGROUP }}
          ATHENA_OUTPUT_LOCATION: ${{ vars.ATHENA_OUTPUT_LOCATION }}
        run: |
          envsubst < deploy/ecs-task-definition.json > api-task-definition.json
          envsubst < deploy/ecs-task-definition.flusher.json > flusher-task-definition.json

      - name: Set image in API task definition
        id: api-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.image }}

      - name: Set image in flusher task definition
        id: flusher-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: flusher-task-definition.json
          container-name: flusher
          image: ${{ steps.image.outputs.image }}

      - name: Update API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_API_SERVICE }}
          wait-for-service-stability: true

      - name: Update flusher service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.flusher-taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_FLUSHER_SERVICE }}
          wait-for-service-stability: true
